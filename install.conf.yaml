- defaults:
    link:
      create: true
      force: true

- clean: ['~']

- link:
    ~/.bashrc: bashrc
    ~/.bash_profile: bash_profile
    ~/.bash_logout: bash_logout
    ~/.config/starship.toml: config/starship.toml
    ~/.local/share/gnome-shell/extensions: gnome-extensions
    ~/.local/share/backgrounds: backgrounds


- shell:
    - command: dconf load /org/gnome/terminal/ < gnome-terminal.conf
      description: Restore GNOME Terminal settings
    - command: dconf load /org/gnome/desktop/background/ < gnome-wallpaper.conf
      description: Restore GNOME wallpaper
    - command: |
        if command -v paru >/dev/null; then
          echo "📦 paru found, installing packages..."
          cat pkglist.txt | xargs paru -S --needed --noconfirm || echo "❌ paru install failed"
        else
          echo "❌ paru not found in PATH. Skipping package install."
        fi
      description: Install packages from pkglist.txt using paru
    - command: ./scripts/restore-gnome-extensions.sh
      description: Restore GNOME extensions from list
    - command: |
        if ! command -v gnome-shell-extension-installer >/dev/null; then
          echo "🌐 Installing gnome-shell-extension-installer..."
          sudo curl -o /usr/local/bin/gnome-shell-extension-installer \
            https://raw.githubusercontent.com/brunelli/gnome-shell-extension-installer/master/gnome-shell-extension-installer
          sudo chmod +x /usr/local/bin/gnome-shell-extension-installer
        else
          echo "✅ gnome-shell-extension-installer already installed"
        fi
      description: Install gnome-shell-extension-installer if not present
    - command: dconf load /org/gnome/shell/extensions/ < gnome-extensions.conf
      description: Restore GNOME Shell extension settings
